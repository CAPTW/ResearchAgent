name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-contracts:
    name: backend-contracts
    # Python 3.12.12 has an official setup-python build for 24.04, but not
    # 26.04. Keep the runner compatible with the exact mypy toolchain below.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Exact patch, not "3.12". The mypy baseline verifier refuses to run on any
          # other interpreter, because the recorded diagnostics are only meaningful
          # against one exact toolchain.
          python-version: "3.12.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile consistency
        run: uv lock --check

      - name: Install backend dev dependencies
        run: uv sync --frozen --extra dev

      - name: Run backend lint (ruff)
        run: uv run --frozen --extra dev ruff check --no-cache app tests tools scripts

      - name: Check mypy debt baseline
        run: uv run --frozen --extra dev python tools/check_mypy_baseline.py --check

      - name: Check mypy baseline verifier is self-typed
        run: uv run --frozen --extra dev python -m mypy --config-file pyproject.toml --explicit-package-bases --no-incremental --show-error-codes --show-column-numbers --no-pretty --no-color-output --no-error-summary --cache-dir "${{ runner.temp }}/mypy-verifier-cache" tools/check_mypy_baseline.py

      - name: Run backend regression suite
        run: uv run pytest

      - name: Check browser collection with the locked optional PDF engine
        run: |
          uv run --frozen --extra dev --extra fulltext python -c "import fitz"
          uv run --frozen --extra dev --extra fulltext pytest tests/test_browser_collection.py tests/test_review_pdf_extraction.py -q

      - name: Run backend compile sanity
        run: uv run python -m py_compile app/schemas/workspace.py app/schemas/auth.py app/schemas/mcp.py app/schemas/admin.py app/services/outline_history.py app/services/workspace_actions.py app/services/ownership_migration.py app/services/render_deploy_config.py app/auth/config.py app/auth/security.py app/auth/sessions.py app/auth/security_types.py app/ops/runtime.py app/ops/logging.py app/api/auth.py app/api/mcp.py app/api/admin.py app/api/health.py app/api/runs.py app/main.py tools/mcp_connector_smoke.py

      - name: Run backend startup and OpenAPI sanity
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import create_app

          with TestClient(create_app()) as client:
              for path in ("/openapi.json", "/health", "/health/ready", "/settings/status", "/mcp", "/.well-known/oauth-protected-resource/mcp"):
                  response = client.get(path)
                  assert response.status_code == 200, (path, response.status_code, response.text)
                  print(path, response.status_code)
              readiness = client.get("/health/ready").json()
              assert readiness["deployment"]["distributed_scheduler_supported"] is False
              assert readiness["deployment"]["scheduler_architecture"] == "single_node_file_backed"
          PY

      - name: Assert tracked fixtures remain immutable
        run: |
          if ! git diff --quiet --exit-code -- storage/runs; then
            echo "::error title=Fixture immutability violated::Tracked files under storage/runs changed during backend validation."
            git diff -- storage/runs
            exit 1
          fi

  frontend-contracts:
    name: frontend-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run browser collector protocol and worker tests
        working-directory: .
        run: node --test extensions/whale-collector/protocol.test.js extensions/whale-collector/worker.test.js

      - name: Run frontend integration tests
        run: npm run test

      - name: Run frontend production build
        env:
          WEB_APP_BASE_PATH: /app
        run: npm run build
