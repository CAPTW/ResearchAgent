[package]
name = "xrml-desktop-host"
version = "0.1.0"
description = "Tauri v2 host for the XRML native research workspace"
authors = ["CAPTW"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xrml_desktop_host"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "xrml-desktop-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-window-state = "=2.4.1"
tokio = { version = "=1.53.1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Controls_Dialogs"] }
