<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>XRML Research Agent</title>
    <style>
      :root { font-family: "Segoe UI", system-ui, sans-serif; color: #e8f0fb; background: #071426; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 25%, #152b46, #071426 55%); }
      main { width: min(520px, calc(100vw - 48px)); padding: 40px; border: 1px solid #315576; border-radius: 12px; background: #0e2034; box-shadow: 0 24px 80px #02081299; }
      .mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; background: #3f82ff; font-size: 26px; }
      h1 { margin: 20px 0 8px; font-size: 24px; } p { color: #9db0c4; line-height: 1.55; }
      button { display: none; margin-top: 22px; min-height: 40px; padding: 0 18px; border: 0; border-radius: 7px; color: white; background: #3f82ff; font-weight: 700; cursor: pointer; }
      [data-state="error"] button { display: inline-flex; align-items: center; }
      @media (prefers-reduced-motion: no-preference) { .mark { animation: pulse 1.8s ease-in-out infinite; } @keyframes pulse { 50% { transform: scale(.94); opacity: .7; } } }
      @media (forced-colors: active) { main { border: 2px solid CanvasText; } button { border: 1px solid ButtonText; } }
    </style>
  </head>
  <body>
    <main id="host-state" aria-live="polite">
      <div class="mark" aria-hidden="true">⌁</div>
      <h1>XRML Research Agent</h1>
      <p id="host-message">로컬 연구 워크스페이스를 준비하고 있습니다.</p>
      <button id="retry" type="button">다시 시작</button>
    </main>
    <script>
      const state = document.getElementById("host-state");
      const message = document.getElementById("host-message");
      window.xrmlHostFailure = (reason) => {
        state.dataset.state = "error";
        message.textContent = reason || "로컬 워크스페이스를 시작하지 못했습니다.";
      };
      const failure = new URLSearchParams(window.location.search).get("failure");
      if (failure) window.xrmlHostFailure(failure);
      document.getElementById("retry").addEventListener("click", async () => {
        state.dataset.state = "loading";
        message.textContent = "로컬 연구 워크스페이스를 다시 준비하고 있습니다.";
        try {
          await window.__TAURI__.core.invoke("restart_sidecar");
        } catch {
          window.xrmlHostFailure("다시 시작하지 못했습니다. 앱을 닫고 다시 실행하세요.");
        }
      });
    </script>
  </body>
</html>
